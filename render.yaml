services:
  - type: web
    name: soccer-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: DB_STORAGE
        value: /opt/render/project/src/data/soccer.sqlite
    disk:
      name: soccer-api-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
